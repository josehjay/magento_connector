name: Check Frappe dependency pins

on:
  push:
    paths:
      - "pyproject.toml"
      - "requirements.txt"
      - "scripts/check_frappe_pins.py"
      - ".github/workflows/check-frappe-pins.yml"
  pull_request:
    paths:
      - "pyproject.toml"
      - "requirements.txt"
      - "scripts/check_frappe_pins.py"
  schedule:
    # Daily, so Frappe gunicorn/pypika pin bumps are committed before
    # `bench update` hits a conflicting-URL install failure.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      frappe_ref:
        description: "Frappe git ref to compare against"
        required: false
        default: "version-16"

env:
  DEFAULT_FRAPPE_REF: "version-16"

jobs:
  check-pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check pins against Frappe (${{ github.event.inputs.frappe_ref || env.DEFAULT_FRAPPE_REF }})
        run: |
          python scripts/check_frappe_pins.py \
            --frappe-ref "${{ github.event.inputs.frappe_ref || env.DEFAULT_FRAPPE_REF }}"

  auto-sync:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Sync pins to Frappe (${{ github.event.inputs.frappe_ref || env.DEFAULT_FRAPPE_REF }})
        run: |
          python scripts/check_frappe_pins.py \
            --frappe-ref "${{ github.event.inputs.frappe_ref || env.DEFAULT_FRAPPE_REF }}" \
            --fix
      - name: Commit pin updates to the default branch
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: sync Frappe gunicorn/pypika pins"
          file_pattern: pyproject.toml requirements.txt
